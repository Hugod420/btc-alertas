name: Bot alertas BTC

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar mensaje de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-btc
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar mercado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ vars.CAPITAL }}
          RIESGO: ${{ vars.RIESGO }}
          APALANCAMIENTO: ${{ vars.APALANCAMIENTO }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then python bot.py --test; else python bot.py; fi
      - name: Guardar estado
        run: |
          git config user.name "bot-btc"
          git config user.email "bot-btc@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "estado" && git push)
